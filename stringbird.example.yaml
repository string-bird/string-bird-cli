# Copy to stringbird.yaml at your project root and commit it.
# The API key never goes here: set STRINGBIRD_API_KEY.

# Organization id and project id (or slug), from the dashboard. sb init writes this file.
org_id: 0193a1b2-0000-7000-8000-000000000001
project_id: 0193a1b2-0000-7000-8000-000000000002

# One file per locale, relative to this file. {locale} is the BCP 47 code: en, de-AT.
files: src/locales/{locale}.json

# json: values are ICU MessageFormat (FormatJS, i18next-icu). i18next: classic
# i18next v4 JSON ({{name}}, key_one/key_other), converted by the server.
format: json

# Key layout of pulled files: flat or nested. Default: flat for json, nested for i18next.
# structure: nested
